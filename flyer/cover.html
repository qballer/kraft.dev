<!doctype html>
<!-- Luma cover. Render: npx playwright@1.56.1 screenshot --channel chrome --viewport-size "1080,1080" "file://$PWD/flyer/cover.html" flyer/kraft-dev-1-luma-cover-1080.png -->
<html><head><meta charset="utf-8"><style>
:root{--bg:#0e1014;--ink:#eceef2;--ink-2:#9ba2ae;--accent:#ff6a2b;--sans:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;--mono:'SF Mono',ui-monospace,Menlo,monospace}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:var(--bg);color:var(--ink);font-family:var(--sans);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,106,43,.28),transparent 55%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:72px 72px}
.wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.mark{width:200px;height:200px;margin-bottom:46px}
.word{width:300px;margin-bottom:44px}
.word .kd-i{fill:var(--ink)}.word .kd-is{stroke:var(--ink)}.word .kd-a{fill:var(--accent)}
.kicker{font:600 26px/1 var(--mono);letter-spacing:.32em;color:var(--accent);margin-bottom:26px}
h1{font-weight:800;font-size:178px;line-height:.95;letter-spacing:-.035em}
.sub{margin-top:34px;font:600 25px/1.3 var(--mono);letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
.pill{margin-top:58px;background:var(--accent);color:#14161b;font-weight:700;font-size:34px;padding:20px 40px;border-radius:999px}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="wrap">
<svg class="mark" viewBox="2 2 28 28"><rect fill="#eceef2" x="3" y="3" width="12" height="12"/><rect fill="#eceef2" x="3" y="17" width="12" height="12"/><path fill="#ff6a2b" d="M17 3H29L17 15Z"/><path fill="#eceef2" d="M17 17V29H29Z"/></svg>
<div class="kicker">KRAFT DEV #1</div>
<h1>Tel Aviv</h1>
<div class="sub">Engineering Kraft in the<br>age of AI agents</div>
<div class="pill">Wed, Dec 9 · 17:00 · Hosted at HiBob</div>
</div></body></html>
